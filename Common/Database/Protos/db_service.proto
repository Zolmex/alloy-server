// =============================================================================
//  Alloy - Database Service gRPC Contract
// -----------------------------------------------------------------------------
//  This proto defines the Domain Command contract between the GameServer/WebServer
//  (the gRPC *client*) and the DbServer (the gRPC *server*).
//
//  IMPORTANT: We deliberately avoid sending raw Player documents or per-field
//  property diffs over the wire. Instead, GameServer emits explicit *domain
//  commands* (verbs) that DbServer interprets and applies to LiteDB. This keeps
//  the transport schema stable and decoupled from the persisted BSON model.
//
//  Add new commands here as new RPCs on DatabaseService, then reference them
//  from both DbServer (server impl) and GameServer/WebServer (client).
// =============================================================================

syntax = "proto3";

// C# option: namespaces the generated types under DbServer.Protos.
option csharp_namespace = "DbServer.Protos";

// -----------------------------------------------------------------------------
//  Shared message envelopes
// ----------------------------------------------------------------------------//

// Standard acknowledgement returned from every command. The DbServer is the
// single source of truth, so a successful Ack means the change has been
// durably applied to LiteDB.
message CommandAck {
  bool success = 1;

  // Optional human-readable detail (error message, validation failure, etc.).
  string message = 2;
}

// Reusable vector3 used for transform snapshots.
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// -----------------------------------------------------------------------------
//  UpdatePlayerStats command
// -----------------------------------------------------------------------------
//  Applies a logical *stats* mutation. Field presence is governed by `bool`
//  flags (`has_*`) so the GameServer can patch only the values that changed
//  since the last tick without sending the whole object. proto3 does not
//  generate `has_*` accessors for scalars by default, hence the flags.
// ---------------------------------------------------------------------------//
message UpdatePlayerStatsRequest {
  // The LiteDB `_id` of the Player document to mutate (BsonId).
  int32 player_id = 1;

  // Stat deltas derived from game simulation; DbServer adds them to the
  // persisted totals. Using deltas (rather than absolutes) lets multiple
  // GameServer shards contribute to the same player without overwriting.
  int32 hp_delta = 2;
  int32 mp_delta = 3;

  // Absolute values - only applied when the matching `has_*` flag is true.
  bool  has_level = 4;
  int32 level = 5;

  bool  has_experience = 6;
  int64 experience = 7;
}

// -----------------------------------------------------------------------------
//  SavePlayerTransform command
// -----------------------------------------------------------------------------
//  Persists a periodic transform snapshot for a player. Transforms are very
//  high frequency (once per tick / per region-change), so we keep the payload
//  minimal: id + position + facing.
// ---------------------------------------------------------------------------//
message SavePlayerTransformRequest {
  int32 player_id = 1;
  Vector3 position = 2;
  float rotation_y = 3;   // yaw in radians, world-space
}

// =============================================================================
//  The DatabaseService - the only RPC surface exposed by DbServer to its
//  clients (GameServer, WebServer, etc.). Implemented in DbServer as
//  DatabaseServiceImpl and consumed in GameServer via the generated client.
// =============================================================================
service DatabaseService {
  // Apply a logical stats mutation to a player document.
  rpc UpdatePlayerStats    (UpdatePlayerStatsRequest)     returns (CommandAck);

  // Persist the latest transform snapshot for a player.
  rpc SavePlayerTransform  (SavePlayerTransformRequest)   returns (CommandAck);
}
